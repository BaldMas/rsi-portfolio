<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер сигналов + Wallet Hyperliquid</title>
<style>
:root {
  --bg: #0f1218;
  --cd: #181c24;
  --tx: #e8ebf0;
  --mu: #8b93a1;
  --bd: #2a303b;
  --ac: #5b8cff;
  --g: #34d399;
  --r: #f87171;
  --y: #fbbf24;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
.w { max-width: 1200px; margin: 0 auto; padding: 14px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 16px; margin: 0 0 10px 0; }
.mu { color: var(--mu); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
.bar .sp { flex: 1; }
button, select, input, textarea { font: inherit; color: var(--tx); background: var(--cd); border: 1px solid var(--bd); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button.p { background: var(--ac); border-color: var(--ac); color: #fff; }
button.d { color: var(--r); }
.g { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.c { background: var(--cd); border: 1px solid var(--bd); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.t { font-size: 17px; font-weight: 700; }
.b { font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--bd); color: var(--mu); }
.b-lev { color: var(--y); border-color: var(--y); background: rgba(251, 191, 36, 0.1); font-weight: 600; }
.s-open { color: var(--g); border-color: var(--g); }
.s-closed, .s-cancel { opacity: .6; }
svg { width: 100%; height: auto; background: var(--bg); border-radius: 8px; }
.k { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 12px; }
.k b { display: block; font-size: 13px; }
.n { font-size: 12px; color: var(--mu); white-space: pre-wrap; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.r { display: flex; gap: 6px; flex-wrap: wrap; }
.r input { width: 96px; }
.pos { color: var(--g); }
.neg { color: var(--r); }
dialog { border: 1px solid var(--bd); border-radius: 12px; background: var(--cd); color: var(--tx); max-width: 520px; width: calc(100% - 24px); padding: 14px; }
dialog::backdrop { background: #0008; }
.f { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f label { display: flex; flex-direction: column; font-size: 12px; color: var(--mu); gap: 3px; }
.f .w2 { grid-column: 1/3; }
.f input, .f select, .f textarea { width: 100%; }
.btn-sm { font-size: 11px; padding: 2px 8px; border-radius: 6px; }

/* Секция кошелька */
.wallet-box { background: var(--cd); border: 1px solid var(--bd); border-radius: 12px; padding: 14px; margin-bottom: 20px; overflow-x: auto; }
.wallet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
.wallet-addr { font-family: monospace; font-size: 12px; background: var(--bg); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--bd); }
.pos-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; min-width: 700px; }
.pos-table th, .pos-table td { text-align: left; padding: 8px; border-bottom: 1px solid var(--bd); }
.pos-table th { color: var(--mu); font-weight: normal; font-size: 12px; }
.pos-table tfoot td { font-weight: bold; border-top: 1px dashed var(--bd); border-bottom: none; }
</style>
</head>
<body>
<div class="w">
  <h1>Трекер сигналов</h1>
  <div class="mu" id="cnt"></div>

  <!-- Блок кошелька Hyperliquid -->
  <div class="wallet-box">
    <div class="wallet-header">
      <h2>Открытые позиции на Hyperliquid (Perps / Spot / HIP-3 DEX)</h2>
      <div class="wallet-addr" id="wallet-display">0xD34d...3237</div>
    </div>
    <div id="wallet-positions"><div class="mu">Подключение к Hyperliquid API...</div></div>
  </div>

  <div class="bar">
    <select id="fm" onchange="render()"><option value="">Все рынки</option><option value="crypto">Крипта</option><option value="tradfi">TradFi / HIP-3</option></select>
    <select id="fs" onchange="render()"><option value="">Все статусы</option><option value="idea">Идея</option><option value="open">В позиции</option><option value="closed">Закрыта</option><option value="cancel">Отменена</option></select>
    <button onclick="refreshAll()">↻ Загрузить свечи и позиции</button>
    <span class="sp"></span>
    <button onclick="resetData()">Сбросить всё</button>
    <button onclick="io()">Экспорт / импорт</button>
    <button class="p" onclick="edit(null)">+ Сигнал</button>
  </div>
  <div class="g" id="list"></div>
  <p class="mu" style="font-size:12px">Крипта, нефть (CL/WTIOIL), ZHIPU и все HIP-3 подтягиваются напрямую из API Hyperliquid.</p>
</div>

<dialog id="dlg"><div class="f" id="fm2"></div><div class="bar"><button onclick="dlg.close()">Отмена</button><span class="sp"></span><button class="p" onclick="saveE()">Сохранить</button></div></dialog>
<dialog id="io"><textarea id="ta" rows="10" style="width:100%"></textarea><div class="bar"><button onclick="io2.close()">Закрыть</button><span class="sp"></span><button class="p" onclick="imp()">Импортировать JSON</button></div><div class="mu" id="im"></div></dialog>

<script>
const DB_KEY = 'sigtrack_v17';
const WALLET_ADDRESS = '0xD34d5dd388560515575692Dcb6033571513A3237';
const ST = {idea:'Идея', open:'В позиции', closed:'Закрыта', cancel:'Отменена'};

// Маппинг тикеров
const TICKER_MAP = {
  'OIL': 'xyz:CL',
  'WTIOIL': 'xyz:CL',
  'CL': 'xyz:CL',
  'ZHIPU': 'xyz:ZHIPU',
  'SKHYNIX': 'xyz:SKHX',
  'SKHX': 'xyz:SKHX',
  'MU': 'xyz:MU',
  'NBIS': 'xyz:NBIS',
  'SNDK': 'xyz:SNDK'
};

const seed = [
  {id: 1, ticker:'LIT', market:'crypto', kind:'Лонг', entry1:3.904, status:'idea', view:'c', createdAt: Date.now() - 86400000 * 3},
  {id: 2, ticker:'NBIS', market:'tradfi', kind:'Скальп-лонг', entry1:175, status:'idea', view:'c', createdAt: Date.now() - 86400000 * 2},
  {id: 3, ticker:'SNDK', market:'tradfi', kind:'Скальп-лонг · высокий риск', entry1:1326, status:'idea', view:'c', createdAt: Date.now() - 86400000 * 2},
  {id: 4, ticker:'SNDK', market:'tradfi', kind:'Скальп-лонг', entry1:1087, entry2:1012, status:'idea', note:'Зона входа 1087–1012', view:'c', createdAt: Date.now() - 86400000 * 2},
  {id: 5, ticker:'MU', market:'tradfi', kind:'Агрессивный лонг', entry1:773, status:'idea', view:'c', createdAt: Date.now() - 86400000 * 2},
  {id: 6, ticker:'ZHIPU', market:'tradfi', kind:'Лонг', entry1:81.8, entry2:68.7, status:'idea', note:'81.8 отмечено ✅, второй уровень 68.7', view:'c', createdAt: Date.now() - 86400000 * 2},
  {id: 7, ticker:'WTIOIL', market:'tradfi', kind:'Лонг Нефть', entry1:70.5, status:'idea', view:'c', createdAt: Date.now() - 86400000 * 2}
];

let S = [];
let walletPositionsMap = {};

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch(e){}
  return JSON.parse(JSON.stringify(seed));
}

function saveData() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(S)); } catch(e){}
}

function resetData() {
  localStorage.removeItem(DB_KEY);
  S = JSON.parse(JSON.stringify(seed));
  saveData();
  render();
  refreshAll();
}

S = loadData();

const $ = id => document.getElementById(id);
const dlg = $('dlg');
const io2 = $('io');
let eid = null;

const fmt = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('ru', {maximumFractionDigits:4, useGrouping:false});
const fmtUsd = n => (n == null || isNaN(n)) ? '$0.00' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const pc = (n, prefix="") => (n == null || isNaN(n)) ? '—' : `<span class="${n >= 0 ? 'pos' : 'neg'}">${prefix}${n >= 0 ? '+' : ''}${n.toFixed(2)}%</span>`;

function checkHit(entry, candles, createdAt) {
  if (!entry || !candles || !candles.length) return false;
  return candles.some(c => {
    const cTime = c[5];
    if (createdAt && cTime && cTime < createdAt) return false;
    const low = c[3], high = c[2];
    return entry >= low && entry <= high;
  });
}

// Запрос к Hyperliquid API
async function postApi(body) {
  try {
    const r = await fetch('https://api.hyperliquid.xyz/info', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    return null;
  }
}

// Форматирование маржи и плеча
function formatLeverage(levObj) {
  if (!levObj) return '';
  const typeStr = levObj.type === 'isolated' ? 'ISOL' : 'CROSS';
  const valStr = levObj.value ? `${levObj.value}x` : '';
  return `${typeStr} ${valStr}`.trim();
}

// Загрузка позиций
async function fetchWalletPositions() {
  const container = $('wallet-positions');
  container.innerHTML = '<div class="mu">Загрузка данных кошелька...</div>';
  
  try {
    const [mainMeta, xyzMeta, spotState] = await Promise.all([
      postApi({ type: 'meta' }),
      postApi({ type: 'meta', dex: 'xyz' }),
      postApi({ type: 'spotClearinghouseState', user: WALLET_ADDRESS })
    ]);

    const mainCoins = mainMeta?.universe ? mainMeta.universe.map(u => u.name) : [];
    const xyzCoins = xyzMeta?.universe ? xyzMeta.universe.map(u => u.name) : [];

    const [allDexState, l1State, xyzState] = await Promise.all([
      postApi({ type: 'clearinghouseState', user: WALLET_ADDRESS, dex: 'ALL_DEXES' }),
      postApi({ type: 'clearinghouseState', user: WALLET_ADDRESS }),
      postApi({ type: 'clearinghouseState', user: WALLET_ADDRESS, dex: 'xyz' })
    ]);

    const activePositions = [];
    walletPositionsMap = {};

    function parseAssetPositions(positionsArray, dexName = '', metaUniverse = []) {
      if (!Array.isArray(positionsArray)) return;
      
      positionsArray.forEach(p => {
        const pos = p.position || p;
        const szi = parseFloat(pos.szi);
        if (szi !== 0) {
          let coinName = pos.coin;
          
          if (typeof coinName === 'number' || !isNaN(coinName)) {
            const idx = parseInt(coinName);
            coinName = metaUniverse[idx] || (dexName ? `${dexName}:Asset#${idx}` : `Asset#${idx}`);
          }

          if (dexName && !String(coinName).includes(':')) {
            coinName = `${dexName}:${coinName}`;
          }

          const entryPx = parseFloat(pos.entryPx || 0);
          const positionValue = parseFloat(pos.positionValue || (Math.abs(szi) * entryPx));
          const levText = formatLeverage(pos.leverage);

          activePositions.push({
            type: dexName ? `HIP-3 (${dexName})` : 'PERP',
            coin: coinName,
            szi: szi,
            entryPx: entryPx,
            positionValue: positionValue,
            unrealizedPnl: parseFloat(pos.unrealizedPnl || 0),
            returnOnEquity: parseFloat(pos.returnOnEquity || 0) * 100,
            leverage: levText
          });
        }
      });
    }

    if (allDexState) {
      if (Array.isArray(allDexState)) {
        allDexState.forEach(dexSt => {
          const dexName = dexSt.dex || '';
          const metaList = dexName === 'xyz' ? xyzCoins : mainCoins;
          parseAssetPositions(dexSt.assetPositions, dexName, metaList);
        });
      } else if (allDexState.assetPositions) {
        parseAssetPositions(allDexState.assetPositions, '', mainCoins);
      }
    } else {
      if (l1State?.assetPositions) parseAssetPositions(l1State.assetPositions, '', mainCoins);
      if (xyzState?.assetPositions) parseAssetPositions(xyzState.assetPositions, 'xyz', xyzCoins);
    }

    // Спот
    if (spotState?.balances) {
      spotState.balances.forEach(b => {
        const total = parseFloat(b.total);
        if (total > 0 && b.coin !== 'USDC') {
          const entryPx = parseFloat(b.entryPx || 0);
          activePositions.push({
            type: 'SPOT',
            coin: b.coin,
            szi: total,
            entryPx: entryPx,
            positionValue: total * entryPx,
            unrealizedPnl: parseFloat(b.unrealizedPnl || 0),
            returnOnEquity: 0,
            leverage: ''
          });
        }
      });
    }

    // Удаляем дубликаты
    const uniquePositions = [];
    const seenCoins = new Set();
    activePositions.forEach(p => {
      const key = `${p.type}_${p.coin}`;
      if (!seenCoins.has(key)) {
        seenCoins.add(key);
        uniquePositions.push(p);
      }
    });

    if (uniquePositions.length === 0) {
      container.innerHTML = '<div class="mu">Активных позиций не найдено</div>';
      render();
      return;
    }

    let totalPosValue = 0;
    let totalUnrealizedPnl = 0;

    let html = `
      <table class="pos-table">
        <thead>
          <tr>
            <th>Рынок</th>
            <th>Актив / Маржа</th>
            <th>Размер</th>
            <th>Ср. вход</th>
            <th>Стоимость (Value)</th>
            <th>Unrealized PnL</th>
            <th>Действие</th>
          </tr>
        </thead>
        <tbody>
    `;

    uniquePositions.forEach(pos => {
      const rawName = String(pos.coin).toUpperCase();
      const cleanName = rawName.replace('XYZ:', '').replace('@', '');

      walletPositionsMap[rawName] = pos;
      walletPositionsMap[cleanName] = pos;
      if (cleanName === 'CL' || cleanName === 'OIL') {
        walletPositionsMap['WTIOIL'] = pos;
        walletPositionsMap['OIL'] = pos;
        walletPositionsMap['CL'] = pos;
      }

      totalPosValue += pos.positionValue;
      totalUnrealizedPnl += pos.unrealizedPnl;

      const side = pos.type === 'SPOT' 
        ? '<span class="pos">SPOT</span>' 
        : (pos.szi > 0 ? '<span class="pos">LONG</span>' : '<span class="neg">SHORT</span>');

      const levBadge = pos.leverage ? `<span class="b b-lev">${pos.leverage}</span>` : '';

      const pnlStr = pos.type === 'SPOT' 
        ? 'Spot' 
        : `${pc(pos.returnOnEquity)} (${pos.unrealizedPnl >= 0 ? '+' : ''}$${pos.unrealizedPnl.toFixed(2)})`;

      const tradeUrl = `https://app.hyperliquid.xyz/trade/${encodeURIComponent(pos.coin)}`;

      html += `
        <tr>
          <td><span class="b">${pos.type}</span></td>
          <td><b>${pos.coin}</b> ${side} ${levBadge}</td>
          <td>${Math.abs(pos.szi)}</td>
          <td>${fmt(pos.entryPx)}</td>
          <td><b>${fmtUsd(pos.positionValue)}</b></td>
          <td>${pnlStr}</td>
          <td><a href="${tradeUrl}" target="_blank" style="color:var(--ac); text-decoration:none">Торговать ↗</a></td>
        </tr>
      `;
    });

    html += `
        </tbody>
        <tfoot>
          <tr>
            <td colspan="4">Всего по открытым позициям:</td>
            <td>${fmtUsd(totalPosValue)}</td>
            <td colspan="2">${totalUnrealizedPnl >= 0 ? '+' : ''}$${totalUnrealizedPnl.toFixed(2)}</td>
          </tr>
        </tfoot>
      </table>
    `;

    container.innerHTML = html;
    render();

  } catch (e) {
    container.innerHTML = `<div class="mu" style="color:var(--r)">Ошибка загрузки: ${e.message}</div>`;
  }
}

function chart(p) {
  const L = [];
  const rawSymbol = (p.ticker || '').toUpperCase().replace('XYZ:', '').trim();
  const hlSymbol = (TICKER_MAP[rawSymbol] || rawSymbol).replace('xyz:', '');
  const activePos = walletPositionsMap[rawSymbol] || walletPositionsMap[hlSymbol];

  const hit1 = checkHit(p.entry1, p.rawCandles, p.createdAt);
  const hit2 = checkHit(p.entry2, p.rawCandles, p.createdAt);

  if (p.tp2) L.push({v: p.tp2, c: 'var(--g)', t: 'TP2'});
  if (p.tp1) L.push({v: p.tp1, c: 'var(--g)', t: 'TP1'});

  if (activePos && activePos.entryPx > 0) {
    L.push({v: activePos.entryPx, c: 'var(--g)', t: 'Вход кошелька', solid: true});
  }

  if (p.entry1) L.push({v: p.entry1, c: 'var(--ac)', t: 'Вход1' + (hit1 ? ' ✅' : '')});
  if (p.entry2) L.push({v: p.entry2, c: 'var(--ac)', t: 'Вход2' + (hit2 ? ' ✅' : '')});
  if (p.cur) L.push({v: p.cur, c: 'var(--y)', t: 'Цена'});
  if (p.stop) L.push({v: p.stop, c: 'var(--r)', t: 'Стоп'});

  const cd = (p.view === 'c' && p.candles) ? p.candles.slice(-60) : [];
  const vs = L.map(l => l.v).concat(cd.flatMap(c => [c[2], c[3]]));
  if (!vs.length) return '<div class="mu" style="text-align:center;padding:20px;">Загрузка данных...</div>';

  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = (hi - lo) * 0.15 || hi * 0.05;
  lo -= pad; hi += pad;

  const W = 320, H = 170, pl = 6, pr = 85;
  const y = v => H - 8 - (v - lo) / (hi - lo) * (H - 16);

  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  
  if (cd.length) {
    const st = (W - pl - pr) / cd.length, bw = Math.max(1.2, st * 0.5);
    cd.forEach((c, i) => {
      const x = pl + st * (i + 0.5);
      const u = c[4] >= c[1] ? 'var(--g)' : 'var(--r)';
      const t = y(Math.max(c[1], c[4])), b = y(Math.min(c[1], c[4]));
      s += `<line x1="${x}" x2="${x}" y1="${y(c[2])}" y2="${y(c[3])}" stroke="${u}" stroke-width="0.5"/><rect x="${x - bw/2}" y="${t}" width="${bw}" height="${Math.max(0.8, b - t)}" fill="${u}"/>`;
    });
  }

  L.forEach(l => {
    const yy = y(l.v);
    const dash = l.solid ? '' : (l.t === 'Цена' ? ' stroke-dasharray="3 3"' : ' stroke-dasharray="1 2"');
    const strokeWidth = l.solid ? '0.75' : '0.5';
    s += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="${l.c}" stroke-width="${strokeWidth}"${dash}/><text x="${W - pr + 4}" y="${yy + 3}" font-size="9.5" fill="${l.c}">${l.t} ${fmt(l.v)}</text>`;
  });

  return s + '</svg>';
}

function card(p) {
  const rawSymbol = (p.ticker || '').toUpperCase().replace('XYZ:', '').trim();
  const hlSymbol = TICKER_MAP[rawSymbol] || rawSymbol;
  const cleanSymbol = hlSymbol.replace('xyz:', '');
  const activePos = walletPositionsMap[rawSymbol] || walletPositionsMap[cleanSymbol];

  let distHtml = '—';
  let distLabel = 'До входа';

  if (activePos && activePos.entryPx > 0 && p.cur) {
    distLabel = 'От входа';
    const side = activePos.szi < 0 ? -1 : 1;
    const diff = ((p.cur - activePos.entryPx) / activePos.entryPx * 100) * side;
    distHtml = pc(diff);
  } else if (p.cur != null && p.entry1) {
    distLabel = 'До входа';
    const diff = ((p.cur - p.entry1) / p.entry1 * 100);
    distHtml = pc(diff);
  }

  const levBadge = (activePos && activePos.leverage) ? `<span class="b b-lev">${activePos.leverage}</span>` : '';

  const rr = (p.stop != null && p.tp1 != null && p.entry1 && p.entry1 > p.stop) ? ((p.tp1 - p.entry1) / (p.entry1 - p.stop)) : null;
  const tv = `https://app.hyperliquid.xyz/trade/${encodeURIComponent(hlSymbol)}`;

  const hit1 = checkHit(p.entry1, p.rawCandles, p.createdAt);
  const hit2 = checkHit(p.entry2, p.rawCandles, p.createdAt);

  return `
  <div class="c">
    <div class="h">
      <span class="t">${p.ticker || ''}</span>
      ${levBadge}
      <span class="b">${p.market === 'crypto' ? 'Crypto' : 'HIP-3'}</span>
      <span class="b s-${p.status}">${ST[p.status] || p.status}</span>
    </div>
    <div style="color:${/шорт|short/i.test(p.kind)?'var(--r)':'var(--g)'}; font-weight:600">${p.kind || ''}</div>
    ${chart(p)}
    ${p.view === 'c' ? `<div class="n"><div>Hyperliquid (${hlSymbol})</div><button class="p btn-sm" onclick="fetchCandles(${p.id})">↻ Обновить</button></div>` : ''}
    <div class="k">
      <div>Вход<b>${fmt(p.entry1)}${hit1 ? ' ✅' : ''}${p.entry2 ? ' – ' + fmt(p.entry2) + (hit2 ? ' ✅' : '') : ''}</b></div>
      <div>Стоп<b>${fmt(p.stop)}</b></div>
      <div>Тейк<b>${fmt(p.tp1)}${p.tp2 ? ' / ' + fmt(p.tp2) : ''}</b></div>
      <div>Цена<b>${fmt(p.cur)}</b></div>
      <div>${distLabel}<b>${distHtml}</b></div>
      <div>R/R<b>${rr == null ? '—' : rr.toFixed(2)}</b></div>
    </div>
    ${p.note ? `<div class="n">${p.note}</div>` : ''}
    <div class="r">
      <input type="text" placeholder="Новая цена" id="inp_${p.id}">
      <button onclick="price(${p.id})">Записать</button>
    </div>
    <div class="r">
      <button onclick="edit(${p.id})">Изменить</button>
      <button onclick="vw(${p.id})">${p.view === 'c' ? 'Уровни' : 'Свечи'}</button>
      <a href="${tv}" target="_blank"><button>Hyperliquid ↗</button></a>
      <span style="flex:1"></span>
      <button class="d" onclick="del(${p.id})">Удалить</button>
    </div>
  </div>`;
}

function render() {
  const m = $('fm').value;
  const s = $('fs').value;
  const filtered = S.filter(p => (!m || p.market === m) && (!s || p.status === s));
  
  $('list').innerHTML = filtered.length ? filtered.map(card).join('') : '<p class="mu">Нет подходящих позиций</p>';
  $('cnt').textContent = `Всего сигналов: ${S.length} | В позиции: ${S.filter(p => p.status === 'open').length}`;
}

function price(id) {
  const val = parseFloat($('inp_' + id).value.replace(',', '.'));
  if (isNaN(val)) return;
  const p = S.find(x => x.id === id);
  if (p) {
    p.cur = val;
    saveData();
    render();
  }
}

function del(id) {
  if (confirm('Удалить эту позицию?')) {
    S = S.filter(x => x.id !== id);
    saveData();
    render();
  }
}

function vw(id) {
  const p = S.find(x => x.id === id);
  if (p) {
    p.view = p.view === 'c' ? '' : 'c';
    saveData();
    render();
    if (p.view === 'c' && (!p.candles || !p.candles.length)) {
      fetchCandles(id);
    }
  }
}

async function requestHLCandles(coinSymbol, startTime, now) {
  const data = await postApi({
    type: 'candleSnapshot',
    req: { coin: coinSymbol, interval: '4h', startTime: startTime, endTime: now }
  });
  return Array.isArray(data) && data.length > 0 ? data : null;
}

async function fetchCandles(id) {
  const p = S.find(x => x.id === id);
  if (!p) return;

  const rawTicker = (p.ticker || '').toUpperCase().trim();
  const hlTicker = TICKER_MAP[rawTicker] || rawTicker;

  const now = Date.now();
  const startTime = now - (60 * 4 * 3600 * 1000);

  try {
    let data = await requestHLCandles(hlTicker, startTime, now);
    if (!data && !hlTicker.startsWith('xyz:')) {
      data = await requestHLCandles('xyz:' + hlTicker, startTime, now);
    }

    if (data) {
      p.rawCandles = data.map(item => [item.t, parseFloat(item.o), parseFloat(item.h), parseFloat(item.l), parseFloat(item.c), item.t]);
      p.candles = data.map(item => [
        new Date(item.t).toLocaleDateString('ru', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}),
        parseFloat(item.o), parseFloat(item.h), parseFloat(item.l), parseFloat(item.c), item.t
      ]);
      p.cur = p.candles[p.candles.length - 1][4];
      saveData();
      render();
    }
  } catch(e) {}
}

function fetchAllCandles() {
  S.forEach(p => {
    p.view = 'c';
    fetchCandles(p.id);
  });
}

function refreshAll() {
  fetchWalletPositions();
  fetchAllCandles();
}

function edit(id) {
  eid = id;
  const p = id ? S.find(x => x.id === id) : {market:'tradfi', status:'idea', createdAt: Date.now()};
  $('fm2').innerHTML = `
    <label>Тикер<input id="e_ticker" value="${p.ticker||''}"></label>
    <label>Рынок<select id="e_market"><option value="crypto" ${p.market==='crypto'?'selected':''}>Крипта</option><option value="tradfi" ${p.market==='tradfi'?'selected':''}>TradFi / HIP-3</option></select></label>
    <label class="w2">Тип сигнала<input id="e_kind" value="${p.kind||''}"></label>
    <label>Вход 1<input id="e_entry1" value="${p.entry1||''}"></label>
    <label>Вход 2<input id="e_entry2" value="${p.entry2||''}"></label>
    <label>Стоп<input id="e_stop" value="${p.stop||''}"></label>
    <label>Тейк 1<input id="e_tp1" value="${p.tp1||''}"></label>
    <label>Тейк 2<input id="e_tp2" value="${p.tp2||''}"></label>
    <label>Текущая цена<input id="e_cur" value="${p.cur||''}"></label>
    <label>Статус<select id="e_status">
      <option value="idea" ${p.status==='idea'?'selected':''}>Идея</option>
      <option value="open" ${p.status==='open'?'selected':''}>В позиции</option>
      <option value="closed" ${p.status==='closed'?'selected':''}>Закрыта</option>
      <option value="cancel" ${p.status==='cancel'?'selected':''}>Отменена</option>
    </select></label>
    <label class="w2">Заметка<textarea id="e_note" rows="3">${p.note||''}</textarea></label>
  `;
  dlg.showModal();
}

function saveE() {
  const getNum = id => {
    const v = $(id).value.replace(',', '.');
    return v === '' ? null : parseFloat(v);
  };
  const item = {
    id: eid || Date.now(),
    ticker: $('e_ticker').value.toUpperCase(),
    market: $('e_market').value,
    kind: $('e_kind').value,
    entry1: getNum('e_entry1'),
    entry2: getNum('e_entry2'),
    stop: getNum('e_stop'),
    tp1: getNum('e_tp1'),
    tp2: getNum('e_tp2'),
    cur: getNum('e_cur'),
    status: $('e_status').value,
    note: $('e_note').value,
    createdAt: eid ? (S.find(x => x.id === eid)?.createdAt || Date.now()) : Date.now(),
    view: 'c'
  };
  if (eid) {
    const idx = S.findIndex(x => x.id === eid);
    if (idx !== -1) S[idx] = Object.assign(S[idx], item);
  } else {
    S.unshift(item);
  }
  saveData();
  dlg.close();
  render();
  fetchCandles(item.id);
}

function io() { $('ta').value = JSON.stringify(S, null, 2); io2.showModal(); }
function imp() {
  try {
    S = JSON.parse($('ta').value);
    saveData();
    render();
    io2.close();
    refreshAll();
  } catch(e) { alert('Ошибка в формате JSON'); }
}

window.onload = () => {
  render();
  refreshAll();
};
</script>
</body>
</html>
